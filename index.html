<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Atlas Oral — plataforma de aprendizagem ativa para cirurgia oral baseada no material de Hupp." />
  <title>Atlas Oral · Cirurgia Oral</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <div class="brand"><div class="brand-mark">AO</div><div><strong>Atlas Oral</strong><span>Cirurgia baseada em evidências</span></div></div>
      <button class="mobile-close" id="closeSidebar" aria-label="Fechar menu">×</button>
      <nav class="nav-list">
        <button class="nav-item active" data-view="home"><span>⌂</span> Início</button>
        <button class="nav-item" data-view="content"><span>▤</span> Conteúdo</button>
        <button class="nav-item" data-view="map"><span>⌘</span> Mapa de conceitos</button>
        <button class="nav-item" data-view="flashcards"><span>◇</span> Flashcards <b class="nav-count" id="dueCount">0</b></button>
        <button class="nav-item" data-view="quiz"><span>✓</span> Quiz</button>
        <button class="nav-item" data-view="cases"><span>▣</span> Casos clínicos</button>
        <button class="nav-item" data-view="instruments"><span>⌁</span> Instrumentais</button>
        <button class="nav-item" data-view="mnemonics"><span>✦</span> Mnemônicos</button>
        <button class="nav-item" data-view="review"><span>↻</span> Revisão expressa</button>
        <button class="nav-item" data-view="mistakes"><span>!</span> Meus erros</button>
        <button class="nav-item" data-view="simulation"><span>◉</span> Simulado</button>
        <button class="nav-item" data-view="progress"><span>▥</span> Meu progresso</button>
      </nav>
      <div class="sidebar-foot"><div class="mini-avatar">6º</div><div><strong>Odontologia</strong><span>Trilha de cirurgia oral</span></div></div>
    </aside>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main class="main-area">
      <header class="topbar"><button class="menu-toggle" id="openSidebar" aria-label="Abrir menu">☰</button><div class="crumb">TRILHA / <strong id="currentModule">VISÃO GERAL</strong></div><div class="top-actions"><label class="search"><span>⌕</span><input id="globalSearch" type="search" placeholder="Buscar conceitos, instrumentos..." aria-label="Buscar no conteúdo" /></label><button class="icon-btn" id="fontBtn" title="Aumentar fonte">A<span>+</span></button><button class="icon-btn" id="themeBtn" title="Alternar modo escuro">◐</button><div class="score-pill"><i></i><span id="topScore">0 XP</span></div></div></header>
      <div id="searchResults" class="search-results hidden"></div>
      <div class="content-wrap" id="app"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="modal-close" id="modalClose">×</button><div id="modalBody"></div></section></div>
  <script src="script.js"></script>
</body>
</html>
